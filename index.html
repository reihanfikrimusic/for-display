    <!-- Google Font: Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #0d0d0d;
            --card-bg: rgba(255, 255, 255, 0.03);
            --card-hover: rgba(255, 255, 255, 0.08);
            --border-color: rgba(255, 255, 255, 0.12);
            --border-hover: rgba(255, 255, 255, 0.35);
            --text-primary: #ffffff;
            --text-secondary: #8e8e93;
            --text-muted: #555555;
            --accent: #ffffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
            letter-spacing: -0.01em;
        }

        .bg-glow {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 450px;
            height: 450px;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.04) 0%, rgba(0, 0, 0, 0) 70%);
            z-index: -1;
            pointer-events: none;
        }

        .container {
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: fadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .cover-wrapper {
            position: relative;
            margin-bottom: 24px;
        }

        .cover-art {
            width: 190px;
            height: 190px;
            border-radius: 12px;
            object-fit: cover;
            box-shadow: 0 16px 36px rgba(0, 0, 0, 0.6);
            border: 1px solid var(--border-color);
            transition: transform 0.4s ease;
        }

        .cover-art:hover {
            transform: scale(1.02);
        }

        .track-info {
            text-align: center;
            margin-bottom: 32px;
        }

        .artist-name {
            font-size: 0.95rem;
            text-transform: uppercase;
            letter-spacing: 0.18em;
            color: var(--text-secondary);
            font-weight: 500;
            margin-bottom: 6px;
        }

        .track-title {
            font-size: 1.45rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 8px;
            letter-spacing: -0.02em;
        }

        .instruction {
            font-size: 0.85rem;
            color: var(--text-secondary);
            font-weight: 400;
        }

        .links-group {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 36px;
        }

        .link-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 18px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            text-decoration: none;
            color: var(--text-primary);
            transition: all 0.25s ease;
        }

        .link-card:hover {
            background: var(--card-hover);
            border-color: var(--border-hover);
            transform: translateY(-1px);
        }

        .platform-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .platform-icon {
            width: 22px;
            height: 22px;
            fill: currentColor;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .platform-name {
            font-size: 0.95rem;
            font-weight: 500;
            letter-spacing: -0.01em;
        }

        .play-tag {
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            padding: 6px 14px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
            background: transparent;
            color: var(--text-primary);
            transition: all 0.25s ease;
        }

        .link-card:hover .play-tag {
            background: var(--text-primary);
            color: var(--bg-color);
            border-color: var(--text-primary);
        }

        .socials {
            display: flex;
            gap: 20px;
            align-items: center;
            justify-content: center;
            margin-bottom: 30px;
        }

        .social-link {
            color: var(--text-secondary);
            transition: color 0.2s ease, transform 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .social-link:hover {
            color: var(--text-primary);
            transform: translateY(-2px);
        }

        .social-link svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        footer {
            font-size: 0.75rem;
            color: var(--text-muted);
            letter-spacing: 0.05em;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="bg-glow"></div>

    <main class="container">
        <!-- Profile / Cover Artwork -->
        <div class="cover-wrapper">
            <img class="cover-art" src="https://i.scdn.co/image/ab67616d0000b2738e1067680301889f895381d3" alt="Alpha, Beta, and Omega Artwork">
        </div>

        <!-- Release Info -->
        <header class="track-info">
            <h2 class="artist-name">Reihan Fikri</h2>
            <h1 class="track-title">Alpha, Beta, and Omega</h1>
            <p class="instruction">Choose your preferred stream platform</p>
        </header>

        <!-- Streaming Platforms -->
        <section class="links-group">
            <!-- Spotify -->
            <a href="https://open.spotify.com/track/4tzKebIuDOIsrYBFWvZASf" onclick="return gtag_report_conversion('https://open.spotify.com/track/4tzKebIuDOIsrYBFWvZASf');" target="_blank" rel="noopener noreferrer" class="link-card">
                <div class="platform-left">
                    <span class="platform-icon">
                        <svg viewBox="0 0 24 24"><path d="M12 2C6.477 2 2 6.477 2 12s4.477 10 10 10 10-4.477 10-10S17.523 2 12 2zm4.586 14.424c-.18.295-.563.387-.857.207-2.35-1.435-5.308-1.76-8.793-.963-.335.077-.67-.133-.746-.469-.077-.334.132-.67.467-.747 3.81-.871 7.081-.497 9.721 1.118.295.18.388.563.208.854zm1.225-2.723c-.226.368-.71.482-1.078.256-2.69-1.653-6.79-2.132-9.972-1.167-.413.125-.852-.107-.977-.521-.125-.413.107-.851.521-.977 3.633-1.102 8.147-.568 11.25 1.341.368.226.482.71.256 1.068zm.105-2.835C14.692 8.95 9.375 8.775 6.297 9.71c-.494.15-1.018-.129-1.168-.623-.15-.495.129-1.018.623-1.168 3.532-1.072 9.404-.866 13.115 1.337.445.264.59.838.327 1.282-.264.443-.838.59-1.278.326z"/></svg>
                    </span>
                    <span class="platform-name">Spotify</span>
                </div>
                <span class="play-tag">Play</span>
            </a>
        </section>

        <!-- Footer -->
        <footer>
            <p>© 2026 Reihan Fikri. All rights reserved.</p>
        </footer>
    </main>

</body>
</html>
